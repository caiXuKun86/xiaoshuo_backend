server:
  port: 8082

spring:
  application:
    name: book-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

  # ========================================================
  # 1. MySQL 数据源配置 (内置 HikariCP 连接池)
  # ========================================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 根据实际情况替换数据库名（如 novel_user）
    url: jdbc:mysql://127.0.0.1:3306/book?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    hikari:
      minimum-idle: 5            # 最小空闲连接数
      maximum-pool-size: 20      # 连接池最大连接数
      idle-timeout: 300000       # 空闲连接存活最大时间 (毫秒)
      connection-timeout: 30000  # 等待连接超时时间 (毫秒)
      max-lifetime: 1800000      # 连接最长生命周期 (毫秒)

  # ========================================================
  # 2. Redis 缓存配置 (Spring Boot 3.x 规范: spring.data.redis)
  # ========================================================
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 1234
      database: 0
      timeout: 5000ms           # 连接超时时间
      lettuce:
        pool:
          max-active: 16        # 连接池最大连接数 (负值表示没有限制)
          max-idle: 8           # 连接池中的最大空闲连接
          min-idle: 2           # 连接池中的最小空闲连接
          max-wait: 3000ms      # 连接池最大阻塞等待时间

# ========================================================
# 3. MyBatis-Plus 核心配置
# ========================================================
mybatis-plus:
  # XML 映射文件存放位置
  mapper-locations: classpath*:/com.kun.service.book.mapper/**/*.xml
  # 实体类包路径 (支持通配符)
  type-aliases-package: com.kun.service.user.entity
  configuration:
    # 开启数据库下划线字段到 Java 驼峰属性映射 (例如: create_time -> createTime)
    map-underscore-to-camel-case: true
    # 控制台打印执行的 SQL 语句 (生产环境建议关闭或通过 logback 控制级别)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false               # 关闭启动时的 MyBatis-Plus Logo
    db-config:
      # 全局主键策略：ASSIGN_ID (雪花算法，对应实体类 Long 类型)
      id-type: assign_id
      # 表名是否使用下划线命名规范
      table-underline: true



# Springdoc / Knife4j 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn